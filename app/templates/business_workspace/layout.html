{% extends "layouts/layout_v2.html" %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/business_workspace/workspace.css">
<link rel="stylesheet" href="/static/css/business_workspace/workspace_override.css">
{% endblock %}

{% block content %}

<div class="workspace-shell">

<header class="workspace-header">

    <div class="user-profile">

        <div class="avatar-circle">
            ت
        </div>

        <div class="user-info">
            <div class="merchant-name">
                {{ merchant_name|default("التاجر") }}
            </div>

            <span class="account-status">
                قيد التوثيق
            </span>
        </div>

    </div>


    <div class="header-actions">

        <button class="icon-btn">
            🔔
            <span class="notification-dot"></span>
        </button>

        <button class="icon-btn">
            👤
        </button>

    </div>

</header>


<main class="workspace-body">

{% block workspace_content %}
{% endblock %}

</main>


<nav class="workspace-nav">

<a href="/merchant" class="nav-item active">
    🏠
    <span>الرئيسية</span>
</a>

<a href="/merchant/deals" class="nav-item">
    🤝
    <span>صفقات</span>
</a>

<a href="/merchant/negotiation" class="nav-item">
    💬
    <span>تفاوض</span>
</a>

<a href="/merchant/finance" class="nav-item">
    💳
    <span>مالية</span>
</a>

<a href="/merchant/guarantee" class="nav-item">
    🛡️
    <span>ضمان</span>
</a>

<a href="/merchant/documents" class="nav-item">
    📄
    <span>وثائق</span>
</a>

</nav>


</div>

{% endblock %}
