<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فرص التعدين</title>

<style>
body{
font-family:Tahoma;
background:#020617;
color:white;
padding:20px;
}

.container{
max-width:1100px;
margin:auto;
}

h1{
color:#fbbf24;
text-align:center;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:30px;
}

.card{
background:#1e293b;
border-radius:18px;
padding:20px;
border:1px solid #334155;
}

.card h3{
color:#fbbf24;
}

.info{
color:#cbd5e1;
line-height:2;
}

.btn{
display:block;
margin-top:15px;
background:#fbbf24;
color:#111827;
padding:10px;
text-align:center;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>⛏️ فرص التعدين المتاحة</h1>

<div id="market" class="grid">
<p>جاري تحميل الفرص...</p>
</div>

</div>


<script>

async function loadMarket(){

const box=document.getElementById("market");

try{

let res=await fetch("/api/opportunities/list");

let data=await res.json();

let items=data.opportunities;


if(!items.length){

box.innerHTML="<p>لا توجد فرص حالياً</p>";
return;

}


box.innerHTML="";


items.forEach(o=>{

box.innerHTML += `

<div class="card">

<h3>${o.type}</h3>

<div class="info">

📍 ${o.location || ""}<br>

🏙️ ${o.city || ""}<br>

💰 ${o.budget || 0} جنيه<br>

📌 ${o.status}

</div>

<a class="btn" href="/">
تسجيل اهتمام
</a>

</div>

`;

});


}catch(e){

box.innerHTML="حدث خطأ في تحميل الفرص";

}

}


loadMarket();

</script>


</body>
</html>
