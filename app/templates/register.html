<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب - منصة السودان للتعدين</title>
<style>
body{
font-family:Tahoma;
background:#020617;
color:white;
padding:20px;
}
.box{
max-width:500px;
margin:auto;
background:#1e293b;
padding:25px;
border-radius:18px;
}
h1{
color:#fbbf24;
}
input,button{
width:100%;
padding:12px;
margin:8px 0;
border-radius:10px;
border:none;
}
button{
background:#fbbf24;
font-weight:bold;
}
a{
color:#fbbf24;
}
</style>
</head>

<body>

<div class="box">

<h1>🔐 {{ t.create_account }}</h1>

<p>
{{ t.register_description }}
</p>

<form id="registerForm">
<input id="name" placeholder="{{ t.full_name }}" required>
<input id="phone" placeholder="{{ t.phone_number }}" required>
<input id="email" placeholder="{{ t.email_address }}" required>
<input id="password" placeholder="{{ t.password }}" type="password" required>

<select id="role" required style="width:100%;padding:12px;margin-top:10px;border-radius:10px;">
    <option value="buyer">مشتري</option>
    <option value="merchant">تاجر</option>
    <option value="agent">وكيل</option>
</select>

<button type="submit">
{{ t.create_account_button }}
</button>
</form>

<script>
document.getElementById("registerForm").onsubmit = async function(e){
    e.preventDefault();

    let res = await fetch("/api/auth/register", {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            name: document.getElementById("name").value,
            phone: document.getElementById("phone").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
            role: document.getElementById("role").value
        })
    });

    let data = await res.json();

    if(data.status === "success"){
        window.location.href="{{ next_page or "/" }}";
    }else{
        alert(JSON.stringify(data));
    }
};
</script>



</div>


<div style="margin-top:20px;text-align:center;">
    <a href="{{ next_page or '/visitor' }}"
       style="display:block;background:#fbbf24;color:#111827;
       padding:12px;border-radius:10px;text-decoration:none;
       font-weight:bold;margin-bottom:10px;">
       🔙 {{ t.back_previous }}
    </a>

    <a href="/market"
       style="display:block;background:#1e293b;color:white;
       padding:12px;border-radius:10px;text-decoration:none;
       border:1px solid #334155;">
       🔍 {{ t.explore_opportunities }}
    </a>

<a href="/"
style="display:block;background:#0f172a;color:white;
padding:12px;border-radius:10px;text-decoration:none;
border:1px solid #334155;margin-top:10px;">
🏠 {{ t.main_interface }}
</a>

</div>
</body>
</html>
